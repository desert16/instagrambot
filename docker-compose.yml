services:
  # ==============================================================================
  # PostgreSQL Database
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: instagrambot-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: instagrambot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d instagrambot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # Redis (BullMQ, Cache, Distributed Locks)
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: instagrambot-redis
    restart: always
    command: redis-server --requirepass redis_secure_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secure_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # NestJS Core API & Background Workers & WebSocket Gateway
  # ==============================================================================
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: instagrambot-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres_secure_password@postgres:5432/instagrambot?schema=public
      REDIS_URL: redis://:redis_secure_password@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_secure_password
      PORT: 4000
    ports:
      - "4000:4000"

  # ==============================================================================
  # Next.js Web Dashboard
  # ==============================================================================
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: instagrambot-web
    restart: always
    depends_on:
      - api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
    ports:
      - "3000:3000"

  # ==============================================================================
  # Nginx Reverse Proxy (SSL, Webhook, WebSockets)
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: instagrambot-nginx
    restart: always
    depends_on:
      - api
      - web
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot_etc:/etc/letsencrypt
      - ./certbot_var:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  redis_data:
